name: Telegram Channel Exporter

on:
  schedule:
    # هر ۳۰ دقیقه اجرا شود
    - cron: '*/30 * * * *'
  workflow_dispatch: # امکان اجرای دستی

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export-channels:
    runs-on: ubuntu-latest
    
    steps:
    # ==========================================
    # گام ۱: دریافت کد از شاخه اصلی
    # ==========================================
    - name: Checkout Code (Main)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 
        
    # ==========================================
    # گام ۲: نصب Go
    # ==========================================
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    # ==========================================
    # گام ۳: نصب وابستگی‌ها
    # ==========================================
    - name: Install Dependencies
      run: |
        go mod tidy
        
    # ==========================================
    # گام ۴: تنظیم فایل config (اگر وجود نداشت)
    # ==========================================
    - name: Update config with channels
      run: |
        if [ ! -f config.json ]; then
          cat > config.json << EOF
        {
          "channels": [
            "ircfspace",
            "vahidonline"
          ]
        }
        EOF
        fi
        
    # ==========================================
    # گام ۵: اجرای برنامه Go برای دریافت پست‌ها
    # ==========================================
    - name: Run Telegram exporter
      run: |
        go run .
        
    # ==========================================
    # گام ۶: بررسی تغییرات (آیا فایل JSON جدیدی هست؟)
    # ==========================================
    - name: Check for changes
      id: verify-changed
      run: |
        if [ -d "export" ] && [ "$(ls -A export)" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Found $(ls export/*.json | wc -l) JSON files"
          ls -la export/
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No export files found"
        fi

    # ==========================================
    # گام ۷: تنظیمات گیت
    # ==========================================
    - name: Configure Git
      if: steps.verify-changed.outputs.has_changes == 'true'
      run: |
        git config --global user.name "Telegram Exporter Bot"
        git config --global user.email "bot@telefeed.local"

    # ==========================================
    # گام ۸: کامیت تغییرات غیر-export به Main
    # ==========================================
    - name: Commit State (if any) to Main
      if: steps.verify-changed.outputs.has_changes == 'true'
      run: |
        git add -A
        git reset HEAD export/
        if ! git diff --cached --quiet; then
          git commit -m "Update bot state [skip ci]"
          git push origin main
        else
          echo "No changes to commit to main branch."
        fi

    # ==========================================
    # گام ۹: دانلود مدیاها و جایگزینی URL ها
    # ==========================================
    - name: Download Media and Replace URLs
      if: steps.verify-changed.outputs.has_changes == 'true'
      run: |
        echo "📥 شروع دانلود مدیاها و جایگزینی URL ها..."
        echo "زمان شروع: $(date '+%Y-%m-%d %H:%M:%S')"
        
        # حذف کامل پوشه media قبلی (مدیریت فضا)
        rm -rf media/
        mkdir -p media
        
        # پوشه موقت برای JSON های اصلاح‌شده
        mkdir -p /tmp/exports_with_media
        
        # شمارنده‌های کلی
        total_downloaded=0
        total_failed=0
        total_replaced=0
        
        # برای هر فایل JSON
        for json_file in export/*.json; do
          [ -f "$json_file" ] || continue
          channel_name=$(basename "$json_file" .json)
          echo ""
          echo "  📡 ========== پردازش کانال: $channel_name =========="
          
          # پوشه مخصوص این کانال
          mkdir -p "media/$channel_name"
          
          # کپی فایل JSON اصلی
          cp "$json_file" "/tmp/exports_with_media/$(basename "$json_file")"
          
          # استخراج URL های مدیا از نوع telesco.pe
          media_urls=$(jq -r '.posts[]?.media[]? | select(.url | test("telesco.pe")) | .url' "$json_file" 2>/dev/null | sort -u)
          
          if [ -z "$media_urls" ]; then
            echo "  ℹ️ هیچ URL مدیایی در این کانال یافت نشد."
            continue
          fi
          
          counter=0
          channel_downloaded=0
          channel_failed=0
          total_urls=$(echo "$media_urls" | wc -l)
          echo "  🔍 تعداد کل URL های منحصر‌به‌فرد: $total_urls"
          
          while IFS= read -r media_url; do
            [ -z "$media_url" ] && continue
            counter=$((counter + 1))
            
            # نام موقت برای دانلود
            temp_file="media/$channel_name/temp_${counter}"
            echo ""
            echo "  [$counter/$total_urls] 📥 دانلود: ${media_url:0:80}..."
            
            # دانلود با محدودیت ۵۰MB برای همه فایل‌ها
            if curl -sL --retry 3 --max-time 120 --max-filesize 52428800 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.9" \
              -o "$temp_file" "$media_url"; then
              
              # بررسی موفقیت‌آمیز بودن دانلود
              if [ -f "$temp_file" ] && [ -s "$temp_file" ]; then
                
                # 🎯 تشخیص نوع واقعی فایل با دستور file
                mime_type=$(file --mime-type -b "$temp_file" 2>/dev/null || echo "unknown")
                echo "  🔬 نوع تشخیص داده شده: $mime_type"
                
                # انتخاب پسوند بر اساس MIME type
                case "$mime_type" in
                  video/mp4)
                    extension="mp4"
                    ;;
                  video/webm)
                    extension="webm"
                    ;;
                  video/quicktime)
                    extension="mov"
                    ;;
                  video/x-msvideo)
                    extension="avi"
                    ;;
                  video/*)
                    extension="mp4"  # حالت پیش‌فرض برای ویدئوهای ناشناخته
                    ;;
                  image/png)
                    extension="png"
                    ;;
                  image/gif)
                    extension="gif"
                    ;;
                  image/webp)
                    extension="webp"
                    ;;
                  image/svg+xml)
                    extension="svg"
                    ;;
                  image/*)
                    extension="jpg"  # حالت پیش‌فرض برای تصاویر
                    ;;
                  *)
                    # اگر نوع فایل نامشخص بود، از روی URL حدس می‌زنیم
                    if [[ "$media_url" == *".mp4"* ]] || [[ "$media_url" == *"video"* ]]; then
                      extension="mp4"
                    elif [[ "$media_url" == *".png"* ]]; then
                      extension="png"
                    elif [[ "$media_url" == *".gif"* ]]; then
                      extension="gif"
                    elif [[ "$media_url" == *".webp"* ]]; then
                      extension="webp"
                    else
                      extension="jpg"
                    fi
                    echo "  ⚠️ نوع ناشناخته (mime: $mime_type)، پسوند .$extension انتخاب شد"
                    ;;
                esac
                
                local_filename="media_${counter}.${extension}"
                local_path="media/$channel_name/$local_filename"
                
                # انتقال فایل از نام موقت به نام نهایی
                mv "$temp_file" "$local_path"
                
                # جایگزینی URL در فایل JSON کپی‌شده
                safe_new_url="https://raw.githubusercontent.com/${{ github.repository }}/export/$local_path"
                escaped_old=$(echo "$media_url" | sed 's/[\/&]/\\&/g')
                escaped_new=$(echo "$safe_new_url" | sed 's/[\/&]/\\&/g')
                
                sed -i "s|$escaped_old|$escaped_new|g" "/tmp/exports_with_media/$(basename "$json_file")"
                
                file_size=$(du -h "$local_path" | cut -f1)
                echo "  ✅ ذخیره شد: $local_filename (حجم: $file_size, نوع: $extension)"
                
                channel_downloaded=$((channel_downloaded + 1))
                total_downloaded=$((total_downloaded + 1))
                total_replaced=$((total_replaced + 1))
              else
                echo "  ❌ فایل دانلود شده خالی یا ناموجود است"
                rm -f "$temp_file"
                channel_failed=$((channel_failed + 1))
                total_failed=$((total_failed + 1))
              fi
            else
              echo "  ❌ دانلود ناموفق (محدودیت حجم، تایم‌اوت، یا خطای شبکه)"
              rm -f "$temp_file"
              channel_failed=$((channel_failed + 1))
              total_failed=$((total_failed + 1))
            fi
          done <<< "$media_urls"
          
          echo ""
          echo "  📊 آمار کانال $channel_name:"
          echo "    - دانلود موفق: $channel_downloaded"
          echo "    - دانلود ناموفق: $channel_failed"
          echo "  ✅ پایان پردازش کانال: $channel_name"
        done
        
        # جایگزینی فایل‌های JSON اصلی با نسخه‌های اصلاح‌شده
        echo ""
        echo "📝 جایگزینی فایل‌های JSON اصلاح‌شده..."
        cp /tmp/exports_with_media/*.json export/ 2>/dev/null || true
        
        # ==========================================
        # گزارش نهایی از حجم و وضعیت
        # ==========================================
        echo ""
        echo "╔══════════════════════════════════════════╗"
        echo "║     📊 گزارش نهایی دانلود مدیا          ║"
        echo "╚══════════════════════════════════════════╝"
        echo ""
        echo "  📥 کل دانلودهای موفق: $total_downloaded"
        echo "  ❌ کل دانلودهای ناموفق: $total_failed"
        echo "  🔄 کل URL های جایگزین‌شده: $total_replaced"
        echo ""
        
        if [ -d "media" ] && [ "$(ls -A media)" ]; then
          total_files=$(find media/ -type f 2>/dev/null | wc -l)
          total_size=$(du -sh media/ 2>/dev/null | cut -f1)
          echo "  📁 تعداد کل فایل‌های مدیا: $total_files"
          echo "  💾 حجم کل مدیاها: $total_size"
          echo ""
          echo "  📂 تفکیک بر اساس کانال:"
          for channel_dir in media/*/; do
            [ -d "$channel_dir" ] || continue
            channel=$(basename "$channel_dir")
            count=$(find "$channel_dir" -type f | wc -l)
            size=$(du -sh "$channel_dir" | cut -f1)
            # تفکیک نوع فایل‌ها
            imgs=$(find "$channel_dir" -type f \( -iname "*.jpg" -o -iname "*.png" -o -iname "*.gif" -o -iname "*.webp" \) | wc -l)
            vids=$(find "$channel_dir" -type f \( -iname "*.mp4" -o -iname "*.webm" -o -iname "*.mov" \) | wc -l)
            echo "    - $channel: $count فایل ($size) [تصاویر: $imgs, ویدئوها: $vids]"
          done
        else
          echo "  ℹ️ هیچ مدیایی دانلود نشده است."
        fi
        
        echo ""
        echo "  ⏰ زمان پایان: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "═══════════════════════════════════════════"
        
        # هشدار اگر حجم کل بیش از ۹۰۰ مگابایت شد
        if [ -d "media" ]; then
          total_size_kb=$(du -sk media/ 2>/dev/null | cut -f1)
          if [ -n "$total_size_kb" ] && [ "$total_size_kb" -gt 921600 ]; then
            echo ""
            echo "⚠️⚠️⚠️ هشدار جدی: حجم کل مدیاها از ۹۰۰ مگابایت گذشت!"
            echo "محدودیت گیت‌هاب ۱ گیگابایت است. لطفاً تعداد کانال‌ها را کاهش دهید"
            echo "یا برخی کانال‌های پرحجم را از config.json حذف کنید."
          fi
        fi

    # ==========================================
    # گام ۱۰: انتشار فایل‌های نهایی به شاخه export
    # ==========================================
    - name: Publish Channel Exports to Export Branch
      if: steps.verify-changed.outputs.has_changes == 'true'
      run: |
        echo "📤 در حال انتشار به شاخه export..."
        
        # ذخیره فایل‌های جدید در مکان موقت
        mkdir -p /tmp/final_export
        if [ -d "export" ]; then
          cp -r export/*.json /tmp/final_export/ 2>/dev/null || true
        fi
        if [ -d "media" ]; then
          cp -r media /tmp/final_export/ 2>/dev/null || true
        fi

        # سوییچ به شاخه export
        if git show-ref --verify --quiet refs/remotes/origin/export; then
          git checkout --track origin/export
          git pull origin export
        else
          git checkout --orphan export
          git rm -rf .
          echo "# Telegram Channel Exports" > README.md
          echo "This branch contains automated exports from Telegram channels." >> README.md
          echo "" >> README.md
          echo "Last updated: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> README.md
        fi

        # پاکسازی کامل شاخه export (مدیریت فضا)
        rm -rf export/ media/ *.json 2>/dev/null || true
        rm -rf .github/ config.json main.go fetcher_colly.go exporter.go go.mod go.sum 2>/dev/null || true
        
        # کپی فایل‌های جدید از مکان موقت
        cp -r /tmp/final_export/* . 2>/dev/null || true
        
        # به‌روزرسانی README در شاخه export
        echo "# 📡 Telegram Channel Exports" > README.md
        echo "" >> README.md
        echo "**Last updated:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> README.md
        echo "**Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})" >> README.md
        echo "" >> README.md
        echo "## 📋 Available Channels:" >> README.md
        echo "" >> README.md
        echo "| Channel | Posts | Media Files |" >> README.md
        echo "|---------|-------|-------------|" >> README.md
        
        for json_file in *.json; do
          [ -f "$json_file" ] || continue
          channel=$(basename "$json_file" .json)
          posts=$(jq '.posts | length' "$json_file" 2>/dev/null || echo "?")
          
          if [ -d "media/$channel" ]; then
            media_count=$(find "media/$channel" -type f 2>/dev/null | wc -l)
          else
            media_count=0
          fi
          
          echo "| **$channel** | $posts | $media_count |" >> README.md
        done
        
        echo "" >> README.md
        echo "## 🖼️ Media Storage:" >> README.md
        echo "" >> README.md
        if [ -d "media" ] && [ "$(ls -A media)" ]; then
          total_media=$(find media/ -type f 2>/dev/null | wc -l)
          total_size=$(du -sh media/ 2>/dev/null | cut -f1)
          echo "- **Total media files:** $total_media" >> README.md
          echo "- **Total media size:** $total_size" >> README.md
          echo "" >> README.md
          echo "### Breakdown by channel:" >> README.md
          for channel_dir in media/*/; do
            [ -d "$channel_dir" ] || continue
            channel=$(basename "$channel_dir")
            count=$(find "$channel_dir" -type f | wc -l)
            size=$(du -sh "$channel_dir" | cut -f1)
            echo "- **$channel**: $count files ($size)" >> README.md
          done
        else
          echo "No media files stored." >> README.md
        fi
        
        echo "" >> README.md
        echo "---" >> README.md
        echo "*Auto-generated by [TeleFeed](https://github.com/${{ github.repository }})*" >> README.md
        
        # کامیت و پوش
        git add --all
        
        if ! git diff --cached --quiet; then
          git commit -m "🔄 Update exports - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin export --force
          echo "✅ انتشار با موفقیت انجام شد!"
        else
          echo "ℹ️ هیچ تغییری برای انتشار وجود ندارد."
        fi

    # ==========================================
    # گام ۱۱: ساخت گزارش نهایی در GitHub Actions
    # ==========================================
    - name: Create Summary
      if: always()
      run: |
        echo "# 📊 Telegram Channel Export Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Export Time:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.verify-changed.outputs.has_changes }}" == "true" ]; then
          echo "## ✅ Export Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "export" ] && [ "$(ls -A export 2>/dev/null)" ]; then
            echo "### 📁 Exported Channels:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Channel | Posts | JSON Size |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|-----------|" >> $GITHUB_STEP_SUMMARY
            
            for file in export/*.json; do
              if [ -f "$file" ]; then
                channel=$(basename "$file" .json)
                posts=$(jq '.posts | length' "$file" 2>/dev/null || echo "?")
                size=$(stat -c%s "$file" 2>/dev/null || echo "0")
                size_human=$(numfmt --to=iec $size 2>/dev/null || echo "$size bytes")
                echo "| **$channel** | $posts | $size_human |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
          
          if [ -d "media" ] && [ "$(ls -A media 2>/dev/null)" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🖼️ Media Files:" >> $GITHUB_STEP_SUMMARY
            total_media=$(find media/ -type f 2>/dev/null | wc -l)
            total_size=$(du -sh media/ 2>/dev/null | cut -f1)
            echo "- **Total media files:** $total_media" >> $GITHUB_STEP_SUMMARY
            echo "- **Total media size:** $total_size" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📍 **View exports:** [export branch](https://github.com/${{ github.repository }}/tree/export)" >> $GITHUB_STEP_SUMMARY
          echo "📝 **View config:** [config.json](https://github.com/${{ github.repository }}/blob/main/config.json)" >> $GITHUB_STEP_SUMMARY
        else
          echo "## ⚠️ No Changes" >> $GITHUB_STEP_SUMMARY
          echo "No new content was found to export." >> $GITHUB_STEP_SUMMARY
        fi
