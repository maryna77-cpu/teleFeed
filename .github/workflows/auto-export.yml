name: Telegram Channel Exporter

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export-channels:
    runs-on: ubuntu-latest
    
    steps:
    # ==========================================
    # گام ۱: دریافت کد از شاخه اصلی
    # ==========================================
    - name: Checkout Code (Main)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 
        
    # ==========================================
    # گام ۲: نصب Go
    # ==========================================
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    # ==========================================
    # گام ۳: نصب وابستگی‌ها
    # ==========================================
    - name: Install Dependencies
      run: |
        go mod tidy
        
    # ==========================================
    # گام ۴: تنظیم فایل config
    # ==========================================
    - name: Update config with channels
      run: |
        if [ ! -f config.json ]; then
          cat > config.json << EOF
        {
          "channels": [
            "ircfspace",
            "vahidonline"
          ]
        }
        EOF
        fi
        
    # ==========================================
    # گام ۵: اجرای برنامه Go
    # ==========================================
    - name: Run Telegram exporter
      run: |
        go run .
        
    # ==========================================
    # گام ۶: بررسی تغییرات
    # ==========================================
    - name: Check for changes
      id: verify-changed
      run: |
        if [ -d "export" ] && [ "$(ls -A export)" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Found $(ls export/*.json | wc -l) JSON files"
          ls -la export/
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No export files found"
        fi

    # ==========================================
    # گام ۷: تنظیمات گیت
    # ==========================================
    - name: Configure Git
      if: steps.verify-changed.outputs.has_changes == 'true'
      run: |
        git config --global user.name "Telegram Exporter Bot"
        git config --global user.email "bot@telefeed.local"

    # ==========================================
    # گام ۸: کامیت تغییرات غیر-export به Main
    # ==========================================
    - name: Commit State to Main
      if: steps.verify-changed.outputs.has_changes == 'true'
      run: |
        git add -A
        git reset HEAD export/
        if ! git diff --cached --quiet; then
          git commit -m "Update bot state [skip ci]"
          git push origin main
        else
          echo "No changes to commit to main branch."
        fi

    # ==========================================
    # گام ۹: دانلود مدیاها و جایگزینی URL ها
    # ==========================================
    - name: Download Media and Replace URLs
      if: steps.verify-changed.outputs.has_changes == 'true'
      run: |
        echo "📥 شروع دانلود مدیاها و جایگزینی URL ها..."
        echo "زمان شروع: $(date '+%Y-%m-%d %H:%M:%S')"
        
        rm -rf media/
        mkdir -p media
        
        mkdir -p /tmp/exports_with_media
        
        total_downloaded=0
        total_failed=0
        total_videos=0
        total_photos=0
        
        for json_file in export/*.json; do
          [ -f "$json_file" ] || continue
          channel_name=$(basename "$json_file" .json)
          echo ""
          echo "  📡 ========== پردازش کانال: $channel_name =========="
          
          mkdir -p "media/$channel_name"
          cp "$json_file" "/tmp/exports_with_media/$(basename "$json_file")"
          
          media_urls=$(jq -r '.posts[]?.media[]? | select(.url | test("telesco.pe")) | .url' "$json_file" 2>/dev/null | sort -u)
          
          if [ -z "$media_urls" ]; then
            echo "  ℹ️ بدون URL مدیا"
            continue
          fi
          
          counter=0
          total_urls=$(echo "$media_urls" | wc -l)
          echo "  🔍 تعداد URL: $total_urls"
          
          while IFS= read -r media_url; do
            [ -z "$media_url" ] && continue
            counter=$((counter + 1))
            
            temp_file="media/$channel_name/temp_${counter}.bin"
            echo ""
            echo "  [$counter/$total_urls] 📥 ${media_url:0:70}..."
            
            if curl -sL --retry 3 --max-time 120 --max-filesize 52428800 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -o "$temp_file" "$media_url"; then
              
              if [ -f "$temp_file" ] && [ -s "$temp_file" ]; then
                
                mime_type=$(file --mime-type -b "$temp_file" 2>/dev/null || echo "unknown")
                echo "  🔬 MIME: $mime_type"
                
                magic_bytes=$(xxd -p -l 12 "$temp_file" 2>/dev/null | tr '[:upper:]' '[:lower:]')
                echo "  🔍 Magic: ${magic_bytes:0:24}..."
                
                extension=""
                
                # تشخیص ویدئو MP4/MOV
                if [[ "$magic_bytes" == 00000020* ]] || [[ "$magic_bytes" == 0000001c* ]] || \
                   [[ "$magic_bytes" == 00000018* ]] || [[ "$mime_type" == video/mp4 ]] || \
                   [[ "$mime_type" == video/quicktime ]] || [[ "$mime_type" == video/* ]]; then
                  extension="mp4"
                  total_videos=$((total_videos + 1))
                  echo "  🎬 تشخیص: ویدئو MP4/MOV"
                  
                # تشخیص WebM
                elif [[ "$magic_bytes" == 1a45dfa3* ]] || [[ "$mime_type" == video/webm ]]; then
                  extension="webm"
                  total_videos=$((total_videos + 1))
                  echo "  🎬 تشخیص: ویدئو WebM"
                  
                # تشخیص PNG
                elif [[ "$magic_bytes" == 89504e47* ]] || [[ "$mime_type" == image/png ]]; then
                  extension="png"
                  total_photos=$((total_photos + 1))
                  echo "  🖼️ تشخیص: PNG"
                  
                # تشخیص GIF
                elif [[ "$magic_bytes" == 47494638* ]] || [[ "$mime_type" == image/gif ]]; then
                  extension="gif"
                  total_photos=$((total_photos + 1))
                  echo "  🖼️ تشخیص: GIF"
                  
                # تشخیص WebP
                elif [[ "$magic_bytes" == 52494646* && "$magic_bytes" == *57454250* ]] || [[ "$mime_type" == image/webp ]]; then
                  extension="webp"
                  total_photos=$((total_photos + 1))
                  echo "  🖼️ تشخیص: WebP"
                  
                # تشخیص JPEG
                elif [[ "$magic_bytes" == ffd8ff* ]] || [[ "$mime_type" == image/jpeg ]] || [[ "$mime_type" == image/jpg ]]; then
                  extension="jpg"
                  total_photos=$((total_photos + 1))
                  echo "  🖼️ تشخیص: JPEG"
                  
                # fallback با MIME
                else
                  case "$mime_type" in
                    video/*) extension="mp4"; total_videos=$((total_videos + 1)); echo "  🎬 تشخیص با MIME: ویدئو" ;;
                    image/png) extension="png"; total_photos=$((total_photos + 1)); echo "  🖼️ تشخیص با MIME: PNG" ;;
                    image/gif) extension="gif"; total_photos=$((total_photos + 1)); echo "  🖼️ تشخیص با MIME: GIF" ;;
                    image/webp) extension="webp"; total_photos=$((total_photos + 1)); echo "  🖼️ تشخیص با MIME: WebP" ;;
                    image/*) extension="jpg"; total_photos=$((total_photos + 1)); echo "  🖼️ تشخیص با MIME: تصویر" ;;
                    *) extension="jpg"; total_photos=$((total_photos + 1)); echo "  ⚠️ نوع ناشناخته، پیش‌فرض JPEG" ;;
                  esac
                fi
                
                local_filename="media_${counter}.${extension}"
                local_path="media/$channel_name/$local_filename"
                mv "$temp_file" "$local_path"
                
                safe_new_url="https://raw.githubusercontent.com/${{ github.repository }}/export/$local_path"
                escaped_old=$(echo "$media_url" | sed 's/[\/&]/\\&/g')
                escaped_new=$(echo "$safe_new_url" | sed 's/[\/&]/\\&/g')
                sed -i "s|$escaped_old|$escaped_new|g" "/tmp/exports_with_media/$(basename "$json_file")"
                
                file_size=$(du -h "$local_path" | cut -f1)
                echo "  ✅ ذخیره: $local_filename ($file_size)"
                total_downloaded=$((total_downloaded + 1))
              else
                echo "  ❌ فایل خالی"
                rm -f "$temp_file"
                total_failed=$((total_failed + 1))
              fi
            else
              echo "  ❌ دانلود ناموفق"
              rm -f "$temp_file"
              total_failed=$((total_failed + 1))
            fi
          done <<< "$media_urls"
          
          echo "  ✅ پایان $channel_name"
        done
        
        cp /tmp/exports_with_media/*.json export/ 2>/dev/null || true
        
        echo ""
        echo "╔═══════════════════════════╗"
        echo "║   📊 گزارش نهایی مدیا    ║"
        echo "╚═══════════════════════════╝"
        echo "  📥 دانلود موفق: $total_downloaded"
        echo "  ❌ دانلود ناموفق: $total_failed"
        echo "  🎬 ویدئوها: $total_videos"
        echo "  🖼️ تصاویر: $total_photos"
        
        if [ -d "media" ] && [ "$(ls -A media)" ]; then
          total_size=$(du -sh media/ 2>/dev/null | cut -f1)
          echo "  💾 حجم کل: $total_size"
          
          total_size_kb=$(du -sk media/ 2>/dev/null | cut -f1)
          if [ -n "$total_size_kb" ] && [ "$total_size_kb" -gt 921600 ]; then
            echo "  ⚠️⚠️⚠️ هشدار: حجم از ۹۰۰ مگابایت گذشت!"
          fi
        fi

    # ==========================================
    # گام ۱۰: انتشار به شاخه export
    # ==========================================
    - name: Publish Channel Exports to Export Branch
      if: steps.verify-changed.outputs.has_changes == 'true'
      run: |
        echo "📤 در حال انتشار به شاخه export..."
        
        # ذخیره فایل‌های جدید
        rm -rf /tmp/final_export
        mkdir -p /tmp/final_export
        
        if [ -d "export" ]; then
          cp -r export/*.json /tmp/final_export/ 2>/dev/null || true
        fi
        if [ -d "media" ]; then
          cp -r media /tmp/final_export/ 2>/dev/null || true
        fi

        # پاکسازی اجباری فایل‌های untracked
        echo "🧹 پاکسازی فایل‌های untracked..."
        git clean -fd 2>/dev/null || true
        git checkout -- . 2>/dev/null || true
        rm -rf -- * .github .gitignore .gitattributes 2>/dev/null || true
        find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true

        # سوییچ به شاخه export
        if git show-ref --verify --quiet refs/remotes/origin/export; then
          echo "📂 شاخه export وجود دارد، دریافت آخرین نسخه..."
          git fetch origin export
          git checkout -f export
          git reset --hard origin/export
        else
          echo "🆕 ساخت شاخه export جدید..."
          git checkout --orphan export
          git rm -rf --cached . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
        fi

        # پاکسازی محتوای قبلی
        echo "🧹 پاکسازی محتوای قبلی شاخه export..."
        rm -rf -- * .github 2>/dev/null || true
        find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
        
        # کپی فایل‌های جدید
        echo "📋 کپی فایل‌های جدید..."
        cp -r /tmp/final_export/* . 2>/dev/null || true
        
        # ساخت README
        echo "# 📡 Telegram Channel Exports" > README.md
        echo "" >> README.md
        echo "**Last updated:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> README.md
        echo "**Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})" >> README.md
        echo "" >> README.md
        echo "## 📋 Channels" >> README.md
        echo "" >> README.md
        
        for json_file in *.json; do
          [ -f "$json_file" ] || continue
          channel=$(basename "$json_file" .json)
          posts=$(jq '.posts | length' "$json_file" 2>/dev/null || echo "?")
          echo "- **$channel**: $posts posts" >> README.md
        done
        
        if [ -d "media" ] && [ "$(ls -A media)" ]; then
          echo "" >> README.md
          total_media=$(find media/ -type f 2>/dev/null | wc -l)
          total_size=$(du -sh media/ 2>/dev/null | cut -f1)
          echo "## 🖼️ Media" >> README.md
          echo "- Total files: $total_media" >> README.md
          echo "- Total size: $total_size" >> README.md
        fi
        
        # کامیت و پوش
        git add --all 2>/dev/null || git add -A
        git status
        
        if ! git diff --cached --quiet 2>/dev/null; then
          git commit -m "🔄 Update exports - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin export --force
          echo "✅ انتشار موفق!"
        else
          echo "ℹ️ بدون تغییر"
        fi

    # ==========================================
    # گام ۱۱: گزارش نهایی
    # ==========================================
    - name: Create Summary
      if: always()
      run: |
        echo "# 📊 Telegram Channel Export Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Export Time:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "export" ] && [ "$(ls -A export)" ]; then
          echo "### 📁 Exported Channels:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in export/*.json; do
            if [ -f "$file" ]; then
              channel=$(basename "$file" .json)
              posts=$(jq '.posts | length' "$file" 2>/dev/null || echo "?")
              size=$(stat -c%s "$file" 2>/dev/null || echo "0")
              size_human=$(numfmt --to=iec $size 2>/dev/null || echo "$size bytes")
              echo "- **$channel**: $posts posts ($size_human)" >> $GITHUB_STEP_SUMMARY
            fi
          done
        fi
        
        if [ -d "media" ] && [ "$(ls -A media)" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          total_media=$(find media/ -type f 2>/dev/null | wc -l)
          total_size=$(du -sh media/ 2>/dev/null | cut -f1)
          echo "### 🖼️ Media Files:" >> $GITHUB_STEP_SUMMARY
          echo "- **Total:** $total_media files ($total_size)" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📍 **View exports:** [export branch](https://github.com/${{ github.repository }}/tree/export)" >> $GITHUB_STEP_SUMMARY
        echo "📝 **View config:** [config.json](https://github.com/${{ github.repository }}/blob/main/config.json)" >> $GITHUB_STEP_SUMMARY
